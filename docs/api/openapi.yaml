openapi: 3.1.0
info:
  title: MetaAgent Studio Local API
  version: 0.1.0
  description: |
    Local-first FastAPI core for the MetaAgent Studio desktop/CLI app.
    Single-user. No authentication. License key unlocks Pro stubs.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8000
    description: Local Studio API
tags:
  - name: health
  - name: license
  - name: projects
  - name: sessions
  - name: discovery
  - name: flows
  - name: allocation
  - name: architecture
  - name: gates
  - name: scaffold
  - name: artifacts
  - name: providers
  - name: settings
  - name: events
  - name: pro
    description: Future Pro routers (require active license)
