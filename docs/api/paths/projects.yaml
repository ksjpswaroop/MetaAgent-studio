paths:
  /api/v1/projects:
    get:
      tags: [projects]
      summary: List projects
      operationId: listProjects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: ../components/schemas.yaml#/components/schemas/Project
    post:
      tags: [projects]
      summary: Create project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ProjectCreate
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/Project
  /api/v1/projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [projects]
      summary: Get project
      operationId: getProject
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/Project
        '404':
          description: Not found
    patch:
      tags: [projects]
      summary: Update project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/components/schemas/ProjectUpdate
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/Project
    delete:
      tags: [projects]
      summary: Archive project
      operationId: archiveProject
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: ../components/schemas.yaml#/components/schemas/Project
