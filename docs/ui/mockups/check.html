<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaAgent Studio — Check</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="_shared.css" />
    <style>
      .grid {
        display: grid;
        gap: 1.5rem;
        max-width: 48rem;
        grid-template-columns: auto 1fr;
      }
      @media (max-width: 700px) {
        .grid { grid-template-columns: 1fr; }
      }
      .ring {
        width: 7rem;
        height: 7rem;
        border-radius: 50%;
        border: 4px solid rgba(45, 226, 230, 0.4);
        background: conic-gradient(var(--vap-cyan) 82%, rgba(255, 255, 255, 0.08) 0);
        display: grid;
        place-items: center;
        margin: 0 auto;
      }
      .ring-inner {
        width: 5rem;
        height: 5rem;
        border-radius: 50%;
        background: var(--vap-night);
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 700;
      }
      li { margin: 0.5rem 0; font-size: 0.9rem; }
      .ok { color: var(--vap-cyan); }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="nav">
        <p class="brand">MetaAgent Studio</p>
        <p class="eyebrow">vapor studio</p>
        <a href="home.html">Start</a>
        <a href="studio.html">Build my agent</a>
        <a class="active" href="check.html">Make sure it works</a>
        <a href="kits.html">My saved kits</a>
      </aside>
      <main class="main">
        <div class="grid">
          <div class="glass" style="display: grid; place-items: center; padding: 2rem">
            <div class="ring"><div class="ring-inner">82</div></div>
            <p class="muted" style="font-size: 0.75rem; margin-bottom: 0">Overall score</p>
          </div>
          <div class="glass">
            <h2 class="display" style="margin-top: 0">Make sure it works</h2>
            <ul style="padding-left: 0; list-style: none">
              <li><span class="ok">●</span> Files written</li>
              <li><span class="ok">●</span> Checks ran</li>
              <li><span class="ok">●</span> Zip ready</li>
            </ul>
            <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1rem">
              <button class="btn btn-ghost" type="button">Make it better</button>
              <button class="btn btn-cyan" type="button">Save kit</button>
            </div>
          </div>
        </div>
        <p class="links">
          <a href="studio.html">← Studio</a>
          <a href="kits.html">Kits →</a>
        </p>
      </main>
    </div>
  </body>
</html>
